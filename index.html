<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Browser</title>
<meta name="description" content="Study Browser – open lectures, PDFs and sites side by side. Learn · Explore · Grow.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Study Browser">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="strip"><img class="logo" id="lg" alt="logo"><div id="tabList"></div><button id="newTab" title="New tab">+</button></div>
<div id="tool">
  <button id="back" title="Back">←</button><button id="fwd" title="Forward">→</button><button id="rl" title="Reload">⟳</button><button id="home" title="Home">⌂</button>
  <input id="url" placeholder="Search or Enter URL" autocomplete="off">
  <button id="star" title="Bookmark">★</button><button id="ext" title="Open in browser tab">↗</button><button id="file" title="Open PDF / file from computer">📄</button><button id="pasteBtn" title="Paste link from clipboard in a new tab">📋</button><button id="eq" title="Make all panes equal size">⇹</button><button id="single" title="Single view (undo split)">▣</button><button id="histBtn" title="History">🕘</button><button id="focusBtn" title="Focus mode: hide tabs &amp; toolbar (Alt+F)">⛶</button>
</div>
<div id="ws"><div id="hl"></div></div>
<input type="file" id="picker" hidden multiple>
<div id="fh"><button id="fhShow" title="Show tabs (Esc)">☰ Show tabs</button><button id="fhEq" title="Equal sizes">⇹</button><button id="fhHist" title="History">🕘</button></div>
<div id="hist"><div class="hh"><input id="hq" placeholder="Search history"><button id="hclear">Clear all</button><button id="hx">✕</button></div><div id="hlist"></div></div>
<div id="toast"></div>

<div id="grip" title="Tools"></div>
<div id="side">
  <button data-a="sw"><i>⏱</i>Stopwatch</button>
  <button data-a="clk"><i>🕒</i>Clock</button>
  <button data-a="ana"><i>📊</i>Analytics</button>
  <div class="sep"></div>
  <button data-a="focus"><i>⛶</i>Focus</button>
  <button data-a="inst" id="sideInst" hidden><i>⬇</i>Install</button>
  <button id="sideX" title="Collapse">‹</button>
</div>
<div id="widgets">
  <div class="wd" id="sw" hidden><div class="dig" id="swd" title="Tap to show / hide controls">00:00:00</div>
    <div class="ctl" id="swc"><button id="swp" title="Start / Stop">▶</button><button id="swr" title="Reset">⟲</button><button id="swh" title="Hide controls">👁</button><button id="swx" title="Close stopwatch">✕</button></div></div>
  <div class="wd clk" id="clk" hidden><div class="dig" id="clkd" title="Tap for 12 / 24 hour"></div><div class="sub" id="clks"></div></div>
</div>
<div id="ana" hidden><div class="ap">
  <div class="ah"><b>📊 Analytics</b><span id="adate"></span><button id="aprev">‹</button><button id="anext">›</button><button id="aexp">Export</button><button id="aclr">Clear</button><button id="ax">✕</button></div>
  <div id="abody"></div></div></div>
<script src="app.js"></script>
</body>
</html>
